<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code 파일 업무 실습 · 강사 가이드</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#16191f;--sub:#5f6773;--line:#e2e5ea;--navy:#1f3864;--blue:#2f5bd3;--green:#24803a;--orange:#c2410c;--soft:#f7f8fa;--code:#10151f;--codeink:#eef2f8;--mono:Consolas,"D2Coding",Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 "Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;word-break:keep-all}
header{background:var(--navy);color:#fff;padding:14px 22px}
header h1{margin:0;font-size:20px}
header p{margin:2px 0 0;font-size:14px;opacity:.8}
.tabs{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:5px;padding:9px 16px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font:inherit;font-size:14.5px;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.tabs button small{opacity:.65;margin-left:4px;font-size:12px}
main{max-width:1000px;margin:0 auto;padding:22px 18px 90px}
h2{font-size:26px;margin:4px 0 6px;color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{background:#e9edf4;color:#334;border-radius:99px;padding:2px 11px;font-size:14px}
.chip.b{background:var(--navy);color:#fff}
.goal{background:#fff;border-left:5px solid var(--navy);padding:10px 14px;border-radius:0 8px 8px 0;margin:8px 0 18px}
h3{font-size:19px;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
h3 .n{background:var(--navy);color:#fff;border-radius:6px;font-size:14px;padding:1px 9px}
h3 .n.g{background:var(--green)}
.note{color:var(--sub);font-size:15px;margin:-4px 0 10px}
table.files{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:15px}
table.files td{padding:7px 12px;border-top:1px solid var(--line);vertical-align:top}
table.files tr:first-child td{border-top:none}
table.files td.fn{font-family:var(--mono);font-size:14px;white-space:nowrap;color:#0b3a8c;width:1%}
table.files tr.sub td.fn{padding-left:30px;color:#4b5b77}
table.files tr.sub td{background:var(--soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:12px 0;overflow:hidden}
.card .hd{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:18px}
.card .hd .num{background:var(--orange);color:#fff;border-radius:50%;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.card.p .hd .num{background:var(--green)}
.card .hd .d{margin-left:auto;font-weight:400;color:var(--sub);font-size:14px}
.row{display:grid;grid-template-columns:84px 1fr;gap:10px;padding:9px 16px;border-top:1px dashed #eceef2}
.row:first-of-type{border-top:none}
.lab{font-size:14px;font-weight:700;padding-top:3px}
.lab.say{color:var(--blue)}.lab.fl{color:#0b3a8c}
ul.uf{margin:0;padding-left:0;list-style:none;font-size:15px}ul.uf li{margin:2px 0}ul.uf code{color:#0b3a8c}.lab.do{color:#8a5a00}.lab.in{color:var(--orange)}.lab.ok{color:var(--green)}
.say-t{color:#1d2b55}
.pr{position:relative;background:var(--code);color:var(--codeink);border-radius:9px;padding:11px 14px}
.pr pre{margin:0;white-space:pre-wrap;font-family:var(--mono);font-size:15px;line-height:1.6;padding-right:120px}
.pr .acts{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.pr button{background:#2a3446;color:#fff;border:1px solid #3c4860;border-radius:6px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
.pr button.ok{background:var(--green);border-color:var(--green)}
details{background:#fff;border:1px solid var(--line);border-radius:12px;margin:12px 0;padding:0 16px}
details>summary{cursor:pointer;padding:12px 0;font-weight:700;font-size:17px}
details[open]>summary{border-bottom:1px solid var(--line);margin-bottom:6px}
details .card{border-color:#eceef2}
table.ans{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0 14px}
table.ans td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.ans td:first-child{width:130px;font-weight:700;color:var(--navy)}
.close{background:#eef3fb;border-radius:10px;padding:12px 16px;margin:22px 0}
.close b{color:var(--blue)}
.brk{background:#fff7e8;border:1px solid #f2d39a;border-radius:10px;padding:10px 14px;margin:18px 0}
.nav{display:flex;justify-content:space-between;margin-top:26px}
.nav button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:12px 0}
.box ol,.box ul{margin:4px 0;padding-left:22px}
.box li{margin:3px 0}
.kbd{font-family:var(--mono);font-size:14px;background:#eef1f6;border:1px solid #d2d7e0;border-bottom-width:2px;border-radius:5px;padding:0 6px}
code{font-family:var(--mono);font-size:14px;background:#eef1f6;border-radius:4px;padding:0 5px}
table.t{width:100%;border-collapse:collapse;font-size:15px;background:#fff}
table.t th,table.t td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
table.t th{background:#f0f3f8}
#big{position:fixed;inset:0;background:#0b0f18;color:#f3f6fb;display:none;z-index:50;padding:6vh 6vw;flex-direction:column}
#big.on{display:flex}
#big pre{flex:1;margin:0;white-space:pre-wrap;font-family:var(--mono);font-size:clamp(22px,3vw,42px);line-height:1.5;overflow:auto}
#big div{display:flex;gap:10px;justify-content:flex-end}
#big button{background:#2a3446;color:#fff;border:1px solid #3c4860;border-radius:8px;padding:9px 18px;font:inherit;cursor:pointer}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#16191f;color:#fff;padding:8px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:60}
#toast.on{opacity:1}
@media(max-width:700px){.row{grid-template-columns:1fr;gap:2px}.pr pre{padding-right:0;padding-top:30px}table.files td.fn{white-space:normal}}
@media print{.tabs,.nav,.pr .acts{display:none}section{display:block!important;break-before:page}details{display:block}details>*{display:block}}
</style>
</head>
<body>
<header><h1>Claude Code 파일 업무 실습 · 강사 가이드</h1><p>삼성 TSP · 2시간 · 실습 파일 17개 · 탭을 순서대로</p></header>
<div class="tabs" id="tabs"></div>
<main id="main"></main>
<div id="big"><pre id="bigp"></pre><div><button onclick="copyText(document.getElementById('bigp').textContent)">복사</button><button onclick="closeBig()">닫기 (Esc)</button></div></div>
<div id="toast">복사됨</div>
<script>

  let h=`<h2>추가 실습 (extra 폴더)</h2><div class="goal">빨리 끝난 분, 시간이 남을 때, 교육 후 복습용입니다. 원하는 것을 골라서 하세요.</div>`;
  DATA.extra.forEach(e=>{h+=`<details><summary>${e.id} · ${e.title}  <span style="font-weight:400;color:#5f6773;font-size:14px">(${e.folder})</span></summary>${filesTable(e.files)}${e.prompts.map((p,i)=>pracCard({t:"실습 "+(i+1),p},i+1,"p")).join("")}</details>`});
  if(MODE==="ins") h+=`<details><summary>추가 실습 정답 (강사용)</summary><table class="ans">${DATA.extraAns.map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join("")}</table></details>`;
  return h;
}
const views = [];
DATA.pages.forEach(p=>views.push(p));
DATA.mods.forEach(m=>views.push({id:m.id,tab:m.id,sub:m.title.split(" · ")[0],mod:m}));
if(DATA.extra.length) views.push({id:"extra",tab:"추가 실습",html:null,extra:true});
DATA.tail.forEach(p=>views.push(p));
function render(id){
  const v=views.find(x=>x.id===id)||views[0];
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.id===v.id));
  P.length=0;
  let h=v.mod?modView(v.mod):v.extra?extraView():v.html;
  const i=views.indexOf(v);
  h+=`<div class="nav">${i>0?`<button onclick="go('${views[i-1].id}')">◀ ${views[i-1].tab}</button>`:"<span></span>"}${i<views.length-1?`<button onclick="go('${views[i+1].id}')">${views[i+1].tab} ▶</button>`:""}</div>`;
  document.getElementById("main").innerHTML=h;
  window.scrollTo(0,0);
}
function go(id){location.hash=id}
window.addEventListener("hashchange",()=>render(location.hash.slice(1)));
document.getElementById("tabs").innerHTML=views.map(v=>`<button data-id="${v.id}" onclick="go('${v.id}')">${v.tab}${v.sub&&MODE==="ins"?`<small>${v.sub}</small>`:""}</button>`).join("");
function copyText(t){const done=()=>{const e=document.getElementById("toast");e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1000)};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,()=>fb(t,done))}else fb(t,done)}
function fb(t,done){const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove();done()}
function cp(i,b){copyText(P[i]);b.textContent="복사됨";b.classList.add("ok");setTimeout(()=>{b.textContent="복사";b.classList.remove("ok")},1200)}
function big(i){document.getElementById("bigp").textContent=P[i];document.getElementById("big").classList.add("on")}
function closeBig(){document.getElementById("big").classList.remove("on")}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeBig()});
render(location.hash.slice(1));
</script>
</body>
</html>
